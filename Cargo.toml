[package]
name = "glance"
version = "0.0.0"
edition = "2021"
description = "A fast terminal markdown viewer that renders your LLM's output live"
license = "MIT"
repository = "https://github.com/sutharjay/glance"

[[bin]]
name = "glance"
path = "src/main.rs"

[lib]
name = "glance"
path = "src/lib.rs"

[dependencies]
# Added incrementally per phase to keep first-build fast (see ROADMAP Phase 0.5 note).
# Phase 1 will add: pulldown-cmark, crossterm, syntect (Phase 3), ...
unicode-width = "0.2"
base64 = "0.22"          # OSC 52 clipboard payload encoding
crossterm = "0.28"       # raw mode, key/mouse decode, Windows ConPTY (ADR 0003)
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }  # GFM parse + HTML export
lexopt = "0.3"           # tiny, fast CLI parsing (small-binary priority)
serde = { version = "1", features = ["derive"] }  # config deserialization
toml = "0.8"             # ~/.config/glance/config.toml
regex = "1"              # in-document search
serde_json = "1"           # JSON viewer port (+32 KB; shares serde infra)
notify = "6"             # auto-reload file watching (inotify/FSEvents/ReadDirectoryChangesW)
# Image decode for the image ladder. png+jpeg only (default features pull ~15 formats); +258 KB.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = "2"               # tiny blocking HTTP for remote images (rustls TLS; +1.2 MB, ADR 0006)
# Parsing only (no theme engine): we map syntect scopes → our own Role enum so glance's
# dark/light + OSC 11 theming stays in control. fancy-regex avoids the onig C dependency.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }

[dev-dependencies]
insta = "1"  # golden snapshot tests
# Phase 2+: expectrl (PTY)

# Smallest, fastest binary (ADR 0004): ~3-6 MB target vs mdterm's 9.7 MB.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
