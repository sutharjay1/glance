[package]
name = "glance"
version = "0.0.0"
edition = "2021"
description = "A fast terminal markdown viewer that renders your LLM's output live"
license = "MIT"
repository = "https://github.com/sutharjay/glance"

[[bin]]
name = "glance"
path = "src/main.rs"

[lib]
name = "glance"
path = "src/lib.rs"

[dependencies]
# Added incrementally per phase to keep first-build fast (see ROADMAP Phase 0.5 note).
# Phase 1 will add: pulldown-cmark, crossterm, syntect (Phase 3), ...
unicode-width = "0.2"
base64 = "0.22"          # OSC 52 clipboard payload encoding
crossterm = "0.28"       # raw mode, key/mouse decode, Windows ConPTY (ADR 0003)
pulldown-cmark = { version = "0.12", default-features = false }  # CommonMark + GFM parsing
lexopt = "0.3"           # tiny, fast CLI parsing (small-binary priority)
serde = { version = "1", features = ["derive"] }  # config deserialization
toml = "0.8"             # ~/.config/glance/config.toml
regex = "1"              # in-document search
notify = "6"             # auto-reload file watching (inotify/FSEvents/ReadDirectoryChangesW)

[dev-dependencies]
insta = "1"  # golden snapshot tests
# Phase 2+: expectrl (PTY)

# Smallest, fastest binary (ADR 0004): ~3-6 MB target vs mdterm's 9.7 MB.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
